[build-system]
requires = [
    "setuptools",
    "setuptools-git-versioning",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "mhsg"
description = "Multiple HDL Style Guide"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Natural Language :: English",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Text Processing :: General",
]
keywords = [
    "beautify",
    "guide",
    "lint",
    "style",
    "vhdl",
]
dynamic = [
    "version",
]
readme = "README.rst"
requires-python = ">=3.12"

dependencies = [
    "pyslang>=12.1,<13",
    "PyYAML>=5.1",
]

[dependency-groups]
# Development dependencies, managed with uv: uv sync installs the dev group, which includes tests.
dev = [
    {include-group = "tests"},
    "pre-commit>=3.2.0",
    "pylint",
]
tests = [
    "pytest",
    "pytest-cov",
    "pytest-html",
    "pytest-xdist[psutil]",
]
docs = [
    "docutils",
    "readthedocs-sphinx-search",
    "sphinx",
    "sphinx_rtd_theme",
]

[[project.authors]]
name = "Jeremiah C Leary"
email = "jeremiah.c.leary@gmail.com"

[[project.maintainers]]
name = "Hal Reid"

[project.urls]
Homepage = "https://github.com/xTheBearx/vhdl-style-guide"
Download = "https://github.com/xTheBearx/vhdl-style-guide"
Issues = "https://github.com/xTheBearx/vhdl-style-guide/issues"
Upstream = "https://github.com/jeremiah-c-leary/vhdl-style-guide"

[project.scripts]
mhsg = "mhsg.__main__:main"

[tool.uv]
required-version = ">=0.5.0"

[tool.setuptools-git-versioning]
enabled = true
template = "{tag}"

[tool.setuptools.package-data]
"mhsg" = [
    "option_catalog.yaml",
    "black_box_libraries/*.yaml",
    "rule_sets/*.yaml",
    "rule_aliases.yaml",
    "qualification/*.yaml",
    "qualification/examples/**/*",
]
"mhsg.rules" = [
    "*/preamble_doc.rst",
]
"mhsg.styles" = [
    "*.yaml",
]
"mhsg.styles.code_examples" = [
    "README.rst",
]
"mhsg.vhdlFile.indent" = [
    "*.yaml",
]

[tool.setuptools.packages.find]
exclude = [
    "bin*",
    "build*",
    "docs*",
    "tests*",
]

[tool.black]
line-length = 160

[tool.pylint.MASTER]
# pyslang is a compiled extension: pylint inspects it only by loading it
extension-pkg-allow-list = ["pyslang"]
disable = [
    # Conventions and refactoring suggestions are not enforced yet. Many do not fit the code base,
    # for example the type prefixes in names such as sValue and lTokens fail invalid-name.
    "C",
    "R",
    # Rules often define __init__ only to call the base class, which keeps every rule class uniform.
    "useless-parent-delegation",
    # Methods implement a common interface, so not every argument is used.
    "unused-argument",
    # Module level token lists such as lTokens are passed to the base class with the same name.
    "redefined-outer-name",
    # Base classes set attributes in helper methods called from __init__ or configure.
    "attribute-defined-outside-init",
    "protected-access",
]

[tool.pylint.FORMAT]
max-line-length = 160

[tool.isort]
profile = "black"
atomic = true
combine_as_imports = true

[tool.pytest.ini_options]
addopts = [
    "--cov=mhsg",
    "--import-mode=importlib",
    "--self-contained-html",
    "-n", "auto",
    "-ra",
]
pythonpath = [
    ".",
]
testpaths = [
    "tests",
]

[tool.coverage.run]
parallel = true
branch = true
source = [
    "mhsg",
]
data_file = "${COVERAGE_DATA_FILE-.coverage}"

[tool.coverage.report]
show_missing = true

[tool.check-manifest]
ignore = [
    "*.egg-info",
    "*.egg-info/*",
    "PKG-INFO",
    "setup.cfg"
]
ignore-default-rules = true
