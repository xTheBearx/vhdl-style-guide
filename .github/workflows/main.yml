# Continuous integration. The project is managed with uv: every job installs the locked dependencies from uv.lock.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  BUILD_PYTHON: "3.12"
  SKIP_TEST_ON_GITHUB: "True"

jobs:
  dist:
    name: dist
    runs-on: ubuntu-24.04

    steps:
      - name: checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # cannot be shallow as version will not be generated
      - name: uv.install
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ env.BUILD_PYTHON }}
      - name: dist
        run: |
          uv build --out-dir dist
      - name: archive.upload
        uses: actions/upload-artifact@v6
        with:
          name: dist
          path: |
            dist

  style:
    runs-on: ubuntu-24.04

    steps:
      - name: checkout
        uses: actions/checkout@v5
      - name: uv.install
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ env.BUILD_PYTHON }}
      - name: style
        run: |
          uv run --locked pre-commit run --all-files

  docs:
    runs-on: ubuntu-24.04

    steps:
      - name: checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: uv.install
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ env.BUILD_PYTHON }}
      - name: build
        run: |
          uv run --locked --group docs sphinx-build -W --keep-going docs build.out/docs/html
      - name: archive.upload
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: docs
          path: |
            build.out/docs

  build:
    name: ${{ matrix.python-version }}-build
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version:
          - "3.12"
          - "3.13"

    steps:
      - name: checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: uv.install ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: test
        env:
          COVERAGE_DATA_FILE: build.out/.coverage.py${{ matrix.python-version }}
        run: |
          mkdir -p build.out
          uv run --locked pytest --cov-report=xml:build.out/coverage.xml
      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          directory: build.out
      - name: archive.upload
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: build.out-${{ matrix.python-version }}
          path: |
            build.out

  # Design analysis needs GHDL, Yosys and the GHDL plugin, and sv_lint_011 Verilator, which are system packages
  # rather than Python packages
  design:
    runs-on: ubuntu-24.04

    steps:
      - name: checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: tools.install
        run: |
          sudo apt-get update
          sudo apt-get install --yes ghdl yosys yosys-plugin-ghdl verilator
      - name: uv.install
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ env.BUILD_PYTHON }}
      - name: test
        env:
          # Fail instead of skipping when the tools are missing
          MHSG_REQUIRE_DESIGN_TOOLS: "1"
        run: |
          uv run --locked pytest tests/design tests/svfile/test_verilator.py
      - name: qualification
        # Every case of the qualification suites, design analysis included, must give the recorded findings
        run: |
          for sRuleSet in cdc do254 do254_plus starc; do
            uv run --locked mhsg --qualify $sRuleSet > qualification_$sRuleSet.txt || { tail -40 qualification_$sRuleSet.txt; exit 1; }
            tail -3 qualification_$sRuleSet.txt
          done

  # The same with the YosysHQ OSS CAD Suite, which has what the Ubuntu packages lack: GHDL 7, the yosys-slang plugin
  # for SystemVerilog designs, and SymbiYosys for the formal rules design_025, design_047 and design_048. The suite is
  # pinned to a dated release and cached, so a new release does not change the results on its own; update the date to
  # move to a newer one.
  design-oss:
    runs-on: ubuntu-24.04
    env:
      OSS_CAD_SUITE_DATE: "2026-11-03"

    steps:
      - name: checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # The archive is cached, 750 MB, rather than the 2.5 GB it unpacks to
      - name: tools.cache
        id: tools-cache
        uses: actions/cache@v5
        with:
          path: ~/oss-cad-suite.tgz
          key: oss-cad-suite-${{ env.OSS_CAD_SUITE_DATE }}
      - name: tools.download
        if: steps.tools-cache.outputs.cache-hit != 'true'
        run: |
          sCompact=$(echo "$OSS_CAD_SUITE_DATE" | tr -d -)
          curl -fsSL --retry 3 -o "$HOME/oss-cad-suite.tgz" "https://github.com/YosysHQ/oss-cad-suite-build/releases/download/$OSS_CAD_SUITE_DATE/oss-cad-suite-linux-x64-$sCompact.tgz"
      - name: tools.install
        run: |
          tar xzf "$HOME/oss-cad-suite.tgz" -C "$HOME"
      # The lint rules that run Verilator record the messages of Ubuntu's Verilator, which words them otherwise than
      # the newer one of the suite: the suite's is left out
      - name: tools.verilator
        run: |
          rm -f "$HOME"/oss-cad-suite/bin/verilator*
          sudo apt-get update
          sudo apt-get install --yes verilator
      - name: tools.path
        run: |
          echo "$HOME/oss-cad-suite/bin" >> "$GITHUB_PATH"
      - name: uv.install
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ env.BUILD_PYTHON }}
      - name: tools.versions
        run: |
          yosys -V
          ghdl --version | head -1
          sby --version
          verilator --version
      - name: test
        env:
          MHSG_REQUIRE_DESIGN_TOOLS: "1"
        run: |
          uv run --locked pytest tests/design
      - name: qualification
        run: |
          for sRuleSet in cdc do254 do254_plus starc; do
            uv run --locked mhsg --qualify $sRuleSet > qualification_$sRuleSet.txt || { tail -40 qualification_$sRuleSet.txt; exit 1; }
            tail -3 qualification_$sRuleSet.txt
          done
      - name: real-world SystemVerilog designs
        # The designs that need read_slang; the VHDL designs are checked with the Ubuntu packages
        run: |
          uv run --locked python scripts/real_world_design_check.py --design ibex_core --design ibex_register_file_latch --design common_cells_cdc_fifo_gray
