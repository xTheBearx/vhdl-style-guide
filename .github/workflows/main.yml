# Continuous integration. The project is managed with uv: every job installs the locked dependencies from uv.lock.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  BUILD_PYTHON: "3.12"
  SKIP_TEST_ON_GITHUB: "True"

jobs:
  dist:
    name: dist
    runs-on: ubuntu-24.04

    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # cannot be shallow as version will not be generated
      - name: uv.install
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.BUILD_PYTHON }}
      - name: dist
        run: |
          uv build --out-dir dist
      - name: archive.upload
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist

  style:
    runs-on: ubuntu-24.04

    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: uv.install
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.BUILD_PYTHON }}
      - name: style
        run: |
          uv run --locked pre-commit run --all-files

  docs:
    runs-on: ubuntu-24.04

    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: uv.install
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.BUILD_PYTHON }}
      - name: build
        run: |
          uv run --locked --group docs sphinx-build docs build.out/docs/html
      - name: archive.upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs
          path: |
            build.out/docs

  build:
    name: ${{ matrix.python-version }}-build
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version:
          - "3.12"
          - "3.13"

    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: uv.install ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: test
        env:
          COVERAGE_DATA_FILE: build.out/.coverage.py${{ matrix.python-version }}
        run: |
          mkdir -p build.out
          uv run --locked pytest --cov-report=xml:build.out/coverage.xml
      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          directory: build.out
      - name: archive.upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build.out-${{ matrix.python-version }}
          path: |
            build.out

  # Design analysis needs GHDL, Yosys and the GHDL plugin, which are system packages rather than Python packages
  design:
    runs-on: ubuntu-24.04

    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: tools.install
        run: |
          sudo apt-get update
          sudo apt-get install --yes ghdl yosys yosys-plugin-ghdl
      - name: uv.install
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.BUILD_PYTHON }}
      - name: test
        env:
          # Fail instead of skipping when the tools are missing
          MHSG_REQUIRE_DESIGN_TOOLS: "1"
        run: |
          uv run --locked pytest tests/design
