# Open source VHDL projects used by scripts/real_world_check.py.
#
# Each project is pinned to a commit so that results only change when mhsg
# changes.  Update a commit deliberately and review the new results.
#
# known_issues maps a file path (relative to the project root) to the status
# it is currently expected to have.  A file listed here does not fail the run
# while it keeps that status.  Each entry should name the fork issue that
# tracks it.
#
# exclude lists files that are not checked, for example files that are not
# complete VHDL on their own.

projects:
  - name: osvvm
    url: https://github.com/OSVVM/OSVVM.git
    commit: 716d751566b4fb6479f69c38cc01790744c911b7
    known_issues:
      # #74: continuation lines are aligned before the := moves
      CoveragePkg.vhd: NOT_IDEMPOTENT
      deprecated/CoveragePkg_xilinx.vhd: NOT_IDEMPOTENT

