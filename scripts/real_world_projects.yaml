# Open source VHDL projects used by scripts/real_world_check.py.
#
# Each project is pinned to a commit so that results only change when mhsg
# changes.  Update a commit deliberately and review the new results.
#
# known_issues maps a file path (relative to the project root) to the status
# it is currently expected to have.  A file listed here does not fail the run
# while it keeps that status.  Each entry should name the fork issue that
# tracks it.
#
# exclude lists files that are not checked, for example files that are not
# complete VHDL on their own.

projects:
  - name: osvvm
    url: https://github.com/OSVVM/OSVVM.git
    commit: 716d751566b4fb6479f69c38cc01790744c911b7
    known_issues: {}

  - name: uvvm
    url: https://github.com/UVVM/UVVM.git
    commit: 825072572dbf2d6079c9ca07a55964271b724664
    known_issues: {}

  - name: vunit
    url: https://github.com/VUnit/vunit.git
    commit: 6c2f49f0ec4c4e2a84013a987901c8fce848c654
    known_issues: {}

  - name: poc
    url: https://github.com/VLSI-EDA/PoC.git
    commit: 8c39b2407a97ec81b8601c4b64e4d2e2141ab9cf
    known_issues:
      # #74: continuation lines are aligned before the := moves
      src/common/strings.vhdl: NOT_IDEMPOTENT
      src/mem/sdram/sdram_ctrl_fsm.vhdl: NOT_IDEMPOTENT
      # #75: constant_400 puts the padding in the wrong place
      src/io/uart/uart.pkg.vhdl: NOT_IDEMPOTENT
      tb/misc/stat/stat_Maximum_tb.vhdl: NOT_IDEMPOTENT
      tb/misc/stat/stat_Minimum_tb.vhdl: NOT_IDEMPOTENT
      # #78: translate_off/translate_on pragma rules settle on the second fix
      src/arith/arith_addw.vhdl: NOT_IDEMPOTENT
      src/arith/xilinx/arith_addw_xilinx.vhdl: NOT_IDEMPOTENT
      src/common/utils.vhdl: NOT_IDEMPOTENT
      src/fifo/fifo_cc_got.vhdl: NOT_IDEMPOTENT
      src/fifo/fifo_cc_got_tempgot.vhdl: NOT_IDEMPOTENT
      src/fifo/fifo_cc_got_tempput.vhdl: NOT_IDEMPOTENT
      src/fifo/fifo_ic_got.vhdl: NOT_IDEMPOTENT
      # #79: whitespace from a joined line is removed on the second fix
      src/arith/arith_scaler.vhdl: NOT_IDEMPOTENT
      src/cache/cache_replacement_policy.vhdl: NOT_IDEMPOTENT
      tb/arith/arith_div_tb.vhdl: NOT_IDEMPOTENT

  - name: vhdl-extras
    url: https://github.com/kevinpt/vhdl-extras.git
    commit: b8916c4942e99d02fac04e25799cb2c996eb5870
    exclude:
      # Template that scripts/ada/smc_gen.sh completes into a package
      - scripts/ada/strings_maps_constants.head.vhdl
    known_issues:
      # #74: continuation lines are aligned before the := moves
      rtl/extras/hamming_edac.vhdl: NOT_IDEMPOTENT
