# Designs of the real world projects used by scripts/real_world_design_check.py.
#
# Each entry is a design section for mhsg --design, with paths relative to the project root, the
# environment variables it needs (paths relative to the project root), and the findings known for it.
# A finding listed under known does not fail the run; each should be explained by a comment.
# The projects and their commits are listed in scripts/real_world_projects.yaml.

designs:
- name: neorv32_top
  project: neorv32
  environment:
    NEORV32_HOME: .
  design:
    top: neorv32_top
    libraries:
    - name: neorv32
      files_from: rtl/file_list_core.f
  known:
  # Real by the rule: the reset request synchronizers xrstn_wdt_o and xrstn_ocd_o are reset by the raw rstn_ext_i
  - 'rtl/core/neorv32_sys.vhd(66)design_015 -- Reset rstn_i is released asynchronously: it resets registers clocked by clk_i without a reset synchronizer (2 registers)'
  # Real by STARC 2.10.1.7: memory outputs compared in conditions read as unknown in simulation before they are written
  - 'rtl/core/neorv32_cpu_alu.vhd(98)design_020 -- Output of memory core_complex_gen:1.core_complex_inst.cpu_inst.cpu_regfile_inst.regfile is used in a condition'
  - 'rtl/core/neorv32_cpu_alu.vhd(99)design_020 -- Output of memory core_complex_gen:1.core_complex_inst.cpu_inst.cpu_regfile_inst.regfile is used in a condition'
  - 'rtl/core/neorv32_cpu_alu.vhd(141)design_020 -- Output of memory core_complex_gen:1.core_complex_inst.cpu_inst.cpu_regfile_inst.regfile is used in a condition'
  - 'rtl/core/neorv32_cpu_control.vhd(295)design_020 -- Output of memory core_complex_gen:1.core_complex_inst.cpu_inst.cpu_frontend_inst.prefetch_buffer:1.ipb_inst.memory_large.memory_large_async_read.fifo is used in a condition'
- name: neorv32_wrapper
  project: neorv32
  environment:
    NEORV32_HOME: .
  design:
    top: neorv32_verilog_wrapper
    libraries:
    - name: neorv32
      files_from: rtl/file_list_core.f
      files:
      - rtl/verilog/neorv32_verilog_wrapper.vhd
  known:
  # Read only by the serial shifter, which is not generated with the fast shifter of this configuration
  - rtl/core/neorv32_cpu_alu_bitmanip.vhd(234)design_006 -- Register shifter_start in neorv32_cpu_alu_bitmanip_c0357a32ed1f6a03be92dd094476f7f1a2e214ec is never used
  # Real: loops in functions unrolled into chains of about 90 multiplexers in one clock cycle
  - rtl/core/neorv32_cpu_alu_bitmanip.vhd(593)design_007 -- Path of 97 logic levels to register res_o in neorv32_cpu_alu_bitmanip_c0357a32ed1f6a03be92dd094476f7f1a2e214ec, more than 48
  # Core select for the dual-core configuration; DUAL_CORE_EN is false here, so it is constant and its reads are removed
  - rtl/core/neorv32_tracebuf.vhd(101)design_006 -- Register ctrl_hsel in neorv32_tracebuf_32_5ba93c9db0cff93f52b521d7420e43f6eda2784f is never used
  # Same register: assigned data and DUAL_CORE_EN, which is false here
  - 'rtl/core/neorv32_tracebuf.vhd(113)design_005 -- Register ctrl_hsel in neorv32_tracebuf_32_5ba93c9db0cff93f52b521d7420e43f6eda2784f never changes: it is always 0'
  # Real: mtime_lo is reset by the raw rstn_i instead of rstn_sys; the other two are the reset request synchronizers
  - 'rtl/core/neorv32_top.vhd(1196)design_015 -- Reset rstn_i is released asynchronously: it resets registers clocked by clk_i without a reset synchronizer (3 registers)'
  # Real by the rule: the debug module, reset by rstn_ext, and the core, reset by rstn_sys, exchange data; the watchdog
  # and the debugger can assert rstn_sys alone
  - 'rtl/core/neorv32_cpu_control.vhd(820)design_018 -- neorv32_top_inst.core_complex_gen:1.core_complex_inst.cpu_inst.cpu_control_inst.irq_pnd, reset by neorv32_top_inst.rstn_sys, captures neorv32_top_inst.ocd_enabled.debug_dm_inst.dm_reg, reset by neorv32_top_inst.rstn_ext: asserting neorv32_top_inst.rstn_ext alone can make it metastable'
  - 'rtl/core/neorv32_debug_dm.vhd(539)design_018 -- neorv32_top_inst.ocd_enabled.debug_dm_inst.dci, reset by neorv32_top_inst.rstn_ext, captures neorv32_top_inst.io_system.bus_io_switch_inst.neorv32_bus_reg_inst.device_req_o.meta, reset by neorv32_top_inst.rstn_sys: asserting neorv32_top_inst.rstn_sys alone can make it metastable'
  # Real: the same mtime_lo registers reset by the raw rstn_i, reading the timer reset by rstn_sys
  - 'rtl/core/neorv32_top.vhd(1196)design_018 -- neorv32_top_inst.mtime_lo and 1 more, reset by rstn_i, capture neorv32_top_inst.io_system.clint_enabled.clint_inst.neorv32_clint_mtime_inst.count, reset by neorv32_top_inst.rstn_sys: asserting neorv32_top_inst.rstn_sys alone can make them metastable'
  # Real by STARC 2.10.1.7: memory outputs compared in conditions read as unknown in simulation before they are written
  - 'rtl/core/neorv32_cache.vhd(574)design_020 -- Output of memory neorv32_top_inst.core_complex_gen:1.core_complex_inst.icache_enabled.icache_inst.neorv32_cache_ram_inst.tag_ram_inst.memory_large.spram is used in a condition'
  - 'rtl/core/neorv32_cache.vhd(574)design_020 -- Output of memory neorv32_top_inst.core_complex_gen:1.core_complex_inst.dcache_enabled.dcache_inst.neorv32_cache_ram_inst.tag_ram_inst.memory_large.spram is used in a condition'
  - 'rtl/core/neorv32_cpu_alu.vhd(98)design_020 -- Output of memory neorv32_top_inst.core_complex_gen:1.core_complex_inst.cpu_inst.cpu_regfile_inst.regfile is used in a condition'
  - 'rtl/core/neorv32_cpu_alu.vhd(99)design_020 -- Output of memory neorv32_top_inst.core_complex_gen:1.core_complex_inst.cpu_inst.cpu_regfile_inst.regfile is used in a condition'
  - 'rtl/core/neorv32_cpu_alu.vhd(141)design_020 -- Output of memory neorv32_top_inst.core_complex_gen:1.core_complex_inst.cpu_inst.cpu_regfile_inst.regfile is used in a condition'
  - 'rtl/core/neorv32_cpu_alu_fpu.vhd(339)design_020 -- Output of memory neorv32_top_inst.core_complex_gen:1.core_complex_inst.cpu_inst.cpu_regfile_inst.regfile is used in a condition'
  - 'rtl/core/neorv32_cpu_alu_fpu.vhd(342)design_020 -- Output of memory neorv32_top_inst.core_complex_gen:1.core_complex_inst.cpu_inst.cpu_regfile_inst.regfile is used in a condition'
  - 'rtl/core/neorv32_cpu_alu_fpu.vhd(722)design_020 -- Output of memory neorv32_top_inst.core_complex_gen:1.core_complex_inst.cpu_inst.cpu_regfile_inst.regfile is used in a condition'
  - 'rtl/core/neorv32_cpu_alu_muldiv.vhd(49)design_020 -- Output of memory neorv32_top_inst.core_complex_gen:1.core_complex_inst.cpu_inst.cpu_regfile_inst.regfile is used in a condition'
  - 'rtl/core/neorv32_cpu_frontend.vhd(221)design_020 -- Output of memory neorv32_top_inst.core_complex_gen:1.core_complex_inst.cpu_inst.cpu_frontend_inst.prefetch_buffer:1.ipb_inst.memory_large.memory_large_async_read.fifo is used in a condition'
  - 'rtl/core/neorv32_cpu_frontend.vhd(235)design_020 -- Output of memory neorv32_top_inst.core_complex_gen:1.core_complex_inst.cpu_inst.cpu_frontend_inst.prefetch_buffer:2.ipb_inst.memory_large.memory_large_async_read.fifo is used in a condition'
- name: neorv32_latch_regfile
  project: neorv32
  environment:
    NEORV32_HOME: .
  design:
    top: neorv32_top
    libraries:
    - name: neorv32
      files_from: rtl/file_list_core.f
    generics:
      CPU_RF_ARCH_SEL: 3
  known:
  # Intended: CPU_RF_ARCH_SEL 3 selects the register file built from latches
  - rtl/core/neorv32_cpu_regfile.vhd(215)design_002 -- Synthesis infers a latch for regfile in neorv32_cpu_regfile_5_3 (31 latches)
  # Intended: the latch register file opens its latches with the clock level
  - 'rtl/core/neorv32_cpu_regfile.vhd(214)design_010 -- Clock clk_i is used as data (31 places)'
  # Real by the rule: the reset request synchronizers xrstn_wdt_o and xrstn_ocd_o are reset by the raw rstn_ext_i
  - 'rtl/core/neorv32_sys.vhd(66)design_015 -- Reset rstn_i is released asynchronously: it resets registers clocked by clk_i without a reset synchronizer (2 registers)'
  # Real by STARC 2.10.1.7: memory outputs compared in conditions read as unknown in simulation before they are written
  - 'rtl/core/neorv32_cpu_control.vhd(295)design_020 -- Output of memory core_complex_gen:1.core_complex_inst.cpu_inst.cpu_frontend_inst.prefetch_buffer:1.ipb_inst.memory_large.memory_large_async_read.fifo is used in a condition'
