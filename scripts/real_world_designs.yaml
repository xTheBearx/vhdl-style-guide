- name: hdl_modules_asynchronous_fifo
  project: hdl-modules
  # Each module is a library, listed without a compile order, which GHDL finds (order: auto). hard_fifo, which needs
  # the Xilinx unisim library, is checked by hdl_modules_asynchronous_hard_fifo.
  design:
    top: asynchronous_fifo
    top_library: fifo
    order: auto
    generics:
      width: 8
      depth: 16
    libraries:
    - name: axi
      files:
      - modules/axi/src/*.vhd
    - name: axi_lite
      files:
      - modules/axi_lite/src/*.vhd
    - name: axi_stream
      files:
      - modules/axi_stream/src/*.vhd
    - name: common
      files:
      - modules/common/src/*.vhd
    - name: dma_axi_write_simple
      files:
      - modules/dma_axi_write_simple/src/*.vhd
    - name: fifo
      files:
      - modules/fifo/src/*.vhd
    - name: lfsr
      files:
      - modules/lfsr/src/*.vhd
    - name: math
      files:
      - modules/math/src/*.vhd
    - name: register_file
      files:
      - modules/register_file/src/*.vhd
    - name: resync
      files:
      - modules/resync/src/*.vhd
    - name: ring_buffer
      files:
      - modules/ring_buffer/src/*.vhd
    - name: sine_generator
      files:
      - modules/sine_generator/src/*.vhd
  known: []
- name: hdl_modules_asynchronous_hard_fifo
  project: hdl-modules
  # The FIFO36E2 primitive through stub packages of unisim, written from the instance: no Vivado installation
  design:
    top: asynchronous_hard_fifo
    top_library: hard_fifo
    order: auto
    generics:
      data_width: 32
      enable_output_register: false
    vendor_libraries:
    - vendor: xilinx
      stubs: true
    black_box_libraries: [xilinx]
    black_boxes:
      FIFO36E2:
        # Tied to constants in the wrapper
        ports:
          CAS*: unused
          SLEEP: unused
    libraries:
    - name: common
      files:
      - modules/common/src/*.vhd
    - name: math
      files:
      - modules/math/src/*.vhd
    - name: resync
      files:
      - modules/resync/src/*.vhd
    - name: fifo
      files:
      - modules/fifo/src/*.vhd
    - name: hard_fifo
      files:
      - modules/hard_fifo/src/*.vhd
  known:
  # Real by the declaration: RSTREG is timed by the read clock, and the wrapper drives it with the write side reset
  - modules/hard_fifo/src/fifo36e2_wrapper.vhd(148)design_008 -- select_primitive.fifo36e2_wrapper_inst.fifo36e2_inst.RSTREG (clk_read) captures select_primitive.fifo36e2_wrapper_inst.reset (clk_write) without a synchronizer
- name: surf_clock_manager_7
  project: surf
  # MMCME2_ADV and BUFG through stub packages of unisim: no Vivado installation
  design:
    top: ClockManager7
    top_library: surf
    order: auto
    ghdl_options: [-fsynopsys]
    generics:
      NUM_CLOCKS_G: 2
      CLKFBOUT_MULT_G: 10
      CLKOUT0_DIVIDE_G: 10
      CLKOUT1_DIVIDE_G: 5
    vendor_libraries:
    - vendor: xilinx
      stubs: true
    black_box_libraries: [xilinx]
    libraries:
    - name: surf
      files:
      - base/**/rtl/**/*.vhd
      - axi/**/rtl/**/*.vhd
      - xilinx/general/rtl/*.vhd
      - xilinx/7Series/general/rtl/*.vhd
      # Simulation models the clock manager instantiates when SIMULATION_G is set
      - xilinx/general/tb/MmcmEmulation.vhd
      - base/general/tb/ClkRst.vhd
  known: []
- name: surf_synchronizer_fifo
  project: surf
  # A dual clock FIFO with gray coded pointers, synchronized by vector shift registers
  design:
    top: SynchronizerFifo
    top_library: surf
    order: auto
    ghdl_options: [-fsynopsys, -frelaxed]
    generics:
      COMMON_CLK_G: false
      DATA_WIDTH_G: 8
    vendor_libraries:
    - vendor: xilinx
      stubs: true
    black_box_libraries: [xilinx]
    libraries:
    - name: surf
      files:
      - base/**/rtl/**/*.vhd
      - base/ram/inferred/*.vhd
      - xilinx/general/rtl/*.vhd
  known:
  # Real by the rule: the ready flag of each side, which only changes after a reset, meets the gray coded pointer
  - 'base/fifo/rtl/inferred/FifoRdFsm.vhd(314)design_016 -- Separately synchronized gen_async.fifoasync_1.u_wr_fsm.r (by gen_async.fifoasync_1.u_wrindex.crossdomainsyncreg) and gen_async.fifoasync_1.u_wr_fsm.r(0) (by gen_async.fifoasync_1.u_wrrdy.crossdomainsyncreg(0)) from wr_clk meet again in gen_async.fifoasync_1.u_rd_fsm.r (rd_clk)'
  - 'base/fifo/rtl/inferred/FifoWrFsm.vhd(230)design_016 -- Separately synchronized gen_async.fifoasync_1.u_rd_fsm.r (by gen_async.fifoasync_1.u_rdindex.crossdomainsyncreg) and gen_async.fifoasync_1.u_rd_fsm.r(0) (by gen_async.fifoasync_1.u_rdrdy.crossdomainsyncreg(0)) from rd_clk meet again in gen_async.fifoasync_1.u_wr_fsm.r (wr_clk)'
