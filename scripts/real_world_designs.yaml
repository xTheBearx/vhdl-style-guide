# Designs of the real world projects used by scripts/real_world_design_check.py.
#
# Each entry is a design section for mhsg --design, with paths relative to the project root, the
# environment variables it needs (paths relative to the project root), and the findings known for it.
# A finding listed under known does not fail the run; each should be explained by a comment.
# The projects and their commits are listed in scripts/real_world_projects.yaml.

designs:
- name: neorv32_top
  project: neorv32
  environment:
    NEORV32_HOME: .
  design:
    top: neorv32_top
    libraries:
    - name: neorv32
      files_from: rtl/file_list_core.f
  known: []
- name: neorv32_wrapper
  project: neorv32
  environment:
    NEORV32_HOME: .
  design:
    top: neorv32_verilog_wrapper
    libraries:
    - name: neorv32
      files_from: rtl/file_list_core.f
      files:
      - rtl/verilog/neorv32_verilog_wrapper.vhd
  known:
  # Read only by the serial shifter, which is not generated with the fast shifter of this configuration
  - rtl/core/neorv32_cpu_alu_bitmanip.vhd(234)design_006 -- Register shifter_start in neorv32_cpu_alu_bitmanip_c0357a32ed1f6a03be92dd094476f7f1a2e214ec is never used
  # Real: loops in functions unrolled into chains of about 90 multiplexers in one clock cycle
  - rtl/core/neorv32_cpu_alu_bitmanip.vhd(593)design_007 -- Path of 97 logic levels to register res_o in neorv32_cpu_alu_bitmanip_c0357a32ed1f6a03be92dd094476f7f1a2e214ec, more than 48
  # Core select for the dual-core configuration; DUAL_CORE_EN is false here, so it is constant and its reads are removed
  - rtl/core/neorv32_tracebuf.vhd(101)design_006 -- Register ctrl_hsel in neorv32_tracebuf_32_5ba93c9db0cff93f52b521d7420e43f6eda2784f is never used
  # Same register: assigned data and DUAL_CORE_EN, which is false here
  - 'rtl/core/neorv32_tracebuf.vhd(113)design_005 -- Register ctrl_hsel in neorv32_tracebuf_32_5ba93c9db0cff93f52b521d7420e43f6eda2784f never changes: it is always 0'
- name: neorv32_latch_regfile
  project: neorv32
  environment:
    NEORV32_HOME: .
  design:
    top: neorv32_top
    libraries:
    - name: neorv32
      files_from: rtl/file_list_core.f
    generics:
      CPU_RF_ARCH_SEL: 3
  known:
  # Intended: CPU_RF_ARCH_SEL 3 selects the register file built from latches
  - rtl/core/neorv32_cpu_regfile.vhd(215)design_002 -- Synthesis infers a latch for regfile in neorv32_cpu_regfile_5_3 (31 latches)
