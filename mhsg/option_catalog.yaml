        description: require_blank_line requires a blank line; no_blank_line removes blank lines.
      case_generate_statement_200:
        values: [require_blank_line, no_blank_line]
        description: require_blank_line requires a blank line; no_blank_line removes blank lines.
      component_016:
        values: [require_blank_line, no_blank_line]
        description: require_blank_line requires a blank line; no_blank_line removes blank lines.
      context_024:
        values: [require_blank_line, no_blank_line]
        description: require_blank_line requires a blank line; no_blank_line removes blank lines.
      entity_016:
