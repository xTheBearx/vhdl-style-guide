  suffix_exceptions:
    type: list
    item_type: string
    label: Suffix exceptions
    description: Suffixes (found ignoring case) that must be written as listed; the case option is applied to the rest of the word.
  suffixes:
    type: list
    item_type: string
    label: Suffixes
    description: "Allowed suffixes, compared ignoring case. The fix uses the first one."
  units:
    type: enum
    values: [fs, ps, ns, us, ms, sec, min, hr]
    label: Delay units
    description: Time unit used in the after clause added to signal assignments.
  user_error_message:
    type: string
    label: User error message
    description: Extra text appended to the solution of every violation of this rule. Empty means no message.
  waive_for_locals:
    type: enum
    values: ["yes", "no"]
    label: Waive for locals
    description: "yes allows blocking assignments to variables declared in the block; no reports every blocking assignment outside the header of a for loop. Booleans true/false are also accepted."
  wrap_at_when:
    type: enum
    values: ["yes", "no"]
    label: Wrap at when
    description: yes indents a multiline condition relative to its when keyword; no disables wrapping at when. Booleans true/false are also accepted.
