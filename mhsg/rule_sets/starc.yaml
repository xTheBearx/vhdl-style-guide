    level: Rule
    severity: Error
    status: design
    note: 'Limits: allowed top level blocks clock_gen, reset_gen, ram, rom, io_cells, top_rtl.'
  1.6.2.1:
    title: 'Basic blocks: combinational inputs, registered (flip-flop) outputs'
    level: Recommendation 3
    severity: Note
    status: planned
  1.6.2.2:
