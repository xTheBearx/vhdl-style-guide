  1.6.1.1:
    title: Keep each hierarchy level at 40,000 gates or fewer; smaller at high frequency
    level: Recommendation 2
    severity: Note
    status: design
    note: 'Limits: max gates per level 40000.'
  1.6.1.2:
    title: Use 10,000-40,000-gate basic blocks; no logic above them except CTS buffers
    level: Recommendation 1
    severity: Warning
    status: design
    note: 'Limits: basic block min gates 10000; basic block max gates 40000.'
  1.6.1.3:
    title: Partitioning below basic blocks is left to the designer
    level: Suggestion
    severity: Note
    status: manual
  1.6.1.4:
