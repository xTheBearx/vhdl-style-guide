    level: Suggestion
    severity: Note
    status: design
    note: 'Limits: max subblocks per critical path 2.'
  1.6.3.2:
    title: With speed problems, stay within three sub-blocks
    level: Recommendation 3
    severity: Note
    status: design
    note: 'Limits: max subblocks per critical path 3.'
  1.6.4.1:
