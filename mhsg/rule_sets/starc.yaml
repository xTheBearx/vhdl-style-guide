# STARC RTL Design Style Guide for Verilog HDL.
#
# Each numbered item of the guide is a check, labelled with its number, for example "STARC-2.1.5.1 (rule)".
# Titles are short paraphrases; the guide itself has the full text and the reasons.
#
# The severity follows the item's level in the guide:
#   Rule              Error
#   Recommendation 1  Warning
#   Recommendation 2  Note
#   Recommendation 3  Note
#   Suggestion        Note
#
# Checks without rules record their status:
#   planned  a per-file rule is planned
#   design   needs design analysis of the whole design, planned
#   manual   synthesis and timing scripts, design management or judgement: left to review
#
# The guide is for Verilog; most of its items apply to SystemVerilog as they are. Items the guide marks as Verilog
# only say so in their note.

name: STARC
prefix: STARC
version: '1'
title: RTL Design Style Guide for Verilog HDL
source: STARC (Semiconductor Technology Academic Research Center), RTL Design Style Guide for Verilog HDL, Second Version,
  2006
checks:
  1.1.1.1:
    title: Name each RTL file after the module it holds, with a .v extension
    level: Recommendation 2
    severity: Note
    rules:
    - sv_file_001
    - sv_file_003
    note: 'Limits: file name pattern <module>.v. Verible: module-filename.'
  1.1.1.2:
    title: 'Identifiers: letters, digits and underscore only; first character must be a letter'
    level: Rule
    severity: Error
    rules:
    - sv_naming_009
    note: 'Limits: identifier regex ^[A-Za-z][A-Za-z0-9_]*$.'
  1.1.1.3:
    title: Never use Verilog, SystemVerilog or VHDL keywords as identifiers
    level: Rule
    severity: Error
    rules:
    - sv_naming_010
    note: 'Limits: reserved word sets verilog_ieee1364, systemverilog_ieee1800, vhdl_ieee1076.'
  1.1.1.4:
    title: No names starting with VDD, VSS, VCC, GND or VREF, in any letter case
    level: Rule
    severity: Error
    rules:
    - sv_naming_011
    note: 'Limits: forbidden prefixes VDD, VSS, VCC, GND, VREF; case insensitive yes.'
  1.1.1.5:
    title: Names must not differ only by upper/lower case
    level: Rule
    severity: Error
    rules:
    - sv_naming_012
  1.1.1.6:
    title: No trailing underscore on top-level ports or module names; no consecutive underscores
    level: Recommendation 1
    severity: Warning
    rules:
    - sv_naming_014
  1.1.1.7:
    title: Mark active-low signals with a suffix such as _X or _N
    level: Recommendation 2
    severity: Note
    rules:
    - sv_naming_017
    note: 'Limits: active low suffixes _X, _N.'
  1.1.1.8:
    title: Instance name = module name; repeated instances become <module>_<number>
    level: Recommendation 3
    severity: Note
    rules:
    - sv_naming_015
    note: 'Limits: instance name pattern <module>_<n>.'
  1.1.1.9:
    title: 'Top-level module and port names: at most 16 characters, not case-distinguished'
    level: Recommendation 1
    severity: Warning
    status: planned
    note: 'Limits: max length 16.'
  1.1.1.10:
    title: Do not reuse names of cells in the target ASIC library for instances or modules
    level: Rule
    severity: Error
    status: planned
    note: 'Limits: library cell names none.'
  1.1.2.1:
    title: Module and instance names must be 2 to 32 characters long
    level: Rule
    severity: Error
    rules:
    - sv_naming_013
    note: 'Limits: min length 2; max length 32.'
  1.1.2.2:
    title: Prefix the top-level block name with a hierarchy identification character
    level: Recommendation 3
    severity: Note
    status: design
  1.1.2.3:
    title: A sub-block's hierarchy ID extends its parent's hierarchy ID
    level: Recommendation 3
    severity: Note
    status: design
  1.1.2.4:
    title: Output port names begin with the block's hierarchy ID followed by an underscore
    level: Recommendation 3
    severity: Note
    status: design
    note: 'Limits: output port prefix <hier_id>_.'
  1.1.2.5:
    title: Ports and internal signals should follow distinguishable naming conventions
    level: Suggestion
    severity: Note
    rules:
    - sv_naming_016
  1.1.2.6:
    title: Nets driven by an output port keep that port's name in the parent
    level: Recommendation 2
    severity: Note
    status: design
  1.1.3.1:
    title: Internal signal names should be distinguishable from port names by convention
    level: Suggestion
    severity: Note
    rules:
    - sv_naming_016
  1.1.3.2:
    title: Give internal signals meaningful, descriptive names
    level: Suggestion
    severity: Note
    status: manual
  1.1.3.3:
    title: 'Signal, port, parameter, macro and function names: 2 to 40 characters'
    level: Rule
    severity: Error
    rules:
    - sv_naming_013
    note: 'Limits: min length 2; max length 40.'
  1.1.4.1:
    title: 'Include files: .h/.vh/.inc for RTL; .h/.inc/.ht/.tsk for testbenches'
    level: Recommendation 2
    severity: Note
    rules:
    - sv_file_005
    note: 'Verilog only. Limits: rtl include extensions .h, .vh, .inc; tb include extensions .h, .inc, .ht, .tsk.'
  1.1.4.2:
    title: Parameters use a naming convention distinct from signals
    level: Recommendation 3
    severity: Note
    rules:
    - sv_naming_001
    - sv_naming_008
    note: 'Verible: parameter-name-style.'
  1.1.4.3:
    title: Do not reuse a parameter name in different modules
    level: Recommendation 3
    severity: Note
    status: design
  1.1.4.4:
    title: Use a `define only inside the module where it is defined
    level: Recommendation 1
    severity: Warning
    status: planned
    note: Verilog only.
  1.1.4.5:
    title: Prefix module-local parameters with the hierarchy ID characters
    level: Suggestion
    severity: Note
    status: planned
  1.1.4.6:
    title: Do not drive output ports directly with constant values
    level: Recommendation 1
    severity: Warning
    rules:
    - sv_module_004
  1.1.4.7:
    title: Parameterize port widths of modules intended for reuse
    level: Recommendation 3
    severity: Note
    rules:
    - sv_dimension_004
  1.1.4.8:
    title: Write parameter values with an explicit base ('b, 'h, 'd, 'o)
    level: Recommendation 1
    severity: Warning
    rules:
    - sv_literal_003
    note: Verilog only.
  1.1.4.9:
    title: Give an explicit width to constants wider than 32 bits
    level: Rule
    severity: Error
    rules:
    - sv_literal_004
    note: 'Verilog only. Limits: max unsized bits 32.'
  1.1.5.1:
    title: Register output names should hint at their clock domain or source register
    level: Recommendation 3
    severity: Note
    status: manual
  1.1.5.2:
    title: 'Base names: CLK/CK for clocks, RST_X/RESET_X for resets, EN for enables, plus suffixes'
    level: Recommendation 3
    severity: Note
    status: planned
    note: 'Limits: clock base names CLK, CK; reset base names RST_X, RESET_X; enable base names EN.'
  1.1.5.3:
    title: Choose names that identify the clock
    level: Suggestion
    severity: Note
    status: manual
  1.1.5.4:
    title: Choose names that identify the register
    level: Suggestion
    severity: Note
    status: manual
  1.2.1.1:
    title: Use one clock and one active edge wherever possible
    level: Recommendation 1
    severity: Warning
    status: design
  1.2.1.2:
    title: Never build RS latches or flip-flops out of gate primitives
    level: Rule
    severity: Error
    rules:
    - sv_module_005
  1.2.1.3:
    title: No combinational feedback loops
    level: Rule
    severity: Error
    status: design
  1.3.1.1:
    title: Synchronous-reset coding may synthesize to logic that does not reset reliably
    level: Suggestion
    severity: Note
    status: manual
  1.3.1.2:
    title: Prefer asynchronous reset for initializing registers
    level: Recommendation 3
    severity: Note
    rules:
    - sv_always_021
  1.3.1.3:
    title: Use asynchronous set/reset pins only for the initial reset
    level: Recommendation 1
    severity: Warning
    status: design
  1.3.1.4:
    title: Put synchronously-reset registers in their own hierarchy level
    level: Suggestion
    severity: Note
    status: planned
  1.3.1.5:
    title: Do not use tool-specific synchronous-reset synthesis directives
    level: Recommendation 3
    severity: Note
    rules:
    - sv_comment_001
    note: 'Limits: forbidden pragmas sync_set_reset.'
  1.3.1.6:
    title: One reset net must not feed both asynchronous and synchronous resets
    level: Rule
    severity: Error
    status: design
  1.3.1.7:
    title: No flip-flop with both asynchronous set and asynchronous reset
    level: Recommendation 1
    severity: Warning
    rules:
    - sv_always_014
  1.3.2.1:
    title: No logic on reset lines inside local modules; generate resets in a dedicated module
    level: Recommendation 1
    severity: Warning
    rules:
    - sv_always_023
  1.3.2.2:
    title: Only the initial reset may drive flip-flop asynchronous reset pins
    level: Recommendation 1
    severity: Warning
    rules:
    - design_014
  1.3.2.3:
    title: Optimize with the timing of the reset source signal in mind
    level: Suggestion
    severity: Note
    status: manual
  1.3.3.1:
    title: Board-level reset wiring can cause malfunctions if not handled carefully
    level: Suggestion
    severity: Note
    status: manual
  1.3.3.2:
    title: External initial reset may need synchronization or a noise filter
    level: Recommendation 3
    severity: Note
    status: design
  1.3.3.3:
    title: If reset arrives before clocks run, use asynchronous reset plus a noise filter
    level: Suggestion
    severity: Note
    status: manual
  1.4.1.1:
    title: Generate clocks in separate modules; group gated/multiplied clocks at top level
    level: Recommendation 1
    severity: Warning
    status: design
  1.4.1.2:
    title: Do not run logic synthesis on clock networks
    level: Suggestion
    severity: Note
    status: manual
  1.4.2.1:
