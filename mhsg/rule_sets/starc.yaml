    level: Recommendation 1
    severity: Warning
    status: design
  1.5.1.3:
    title: The first synchronizer flip-flop must not sit in a feedback loop
    level: Rule
    severity: Error
    status: design
  1.5.1.4:
    title: Synchronize noisy external chip inputs against metastability
    level: Recommendation 2
    severity: Note
    status: design
  1.5.2.1:
    title: Insert an inverted-clock latch at asynchronous interfaces
    level: Recommendation 3
    severity: Note
    status: design
  1.5.2.2:
    title: 'Technique: passing data into a faster clock domain'
    level: Suggestion
    severity: Note
    status: manual
  1.5.2.3:
    title: 'Technique: passing data into a slower clock domain'
    level: Suggestion
    severity: Note
    status: manual
  1.5.2.4:
    title: 'Technique: double-register signals at a CPU interface'
    level: Suggestion
    severity: Note
    status: manual
  1.5.3.1:
    title: Use a FIFO between asynchronous clocks of equal period
    level: Suggestion
    severity: Note
    status: manual
  1.5.3.2:
    title: Use frame memory between asynchronous clocks of different periods
    level: Suggestion
    severity: Note
    status: manual
  1.5.4.1:
    title: Add jitter models at asynchronous interfaces in verification
    level: Recommendation 1
    severity: Warning
    status: manual
  1.5.4.2:
    title: Repeat RTL simulation with varied clock periods
    level: Recommendation 2
    severity: Note
    status: manual
  1.5.5.1:
    title: Guarantee setup/hold margins (synchronous RAM interface)
    level: Rule
    severity: Error
    status: manual
  1.5.5.2:
    title: Synchronous RAM hold time is long; countermeasures are needed
    level: Suggestion
    severity: Note
    status: manual
  1.5.5.3:
