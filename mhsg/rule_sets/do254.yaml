# DO-254 coding standards.
#
# Each check of the position paper maps to the mhsg rules that implement it, with the paper's
# default severity. Checks without rules record their status:
#   planned  a per-file lint rule is planned
#   design   needs design analysis of the whole design (GHDL and Yosys), planned
#
# Rules named design_ run only in design analysis, with --design.
#   manual   left to manual code review
#
# Rules are labelled with the check in reports, for example "DO254-CP2 (lint_001)".
#
# The rules named sv_ implement the same checks for SystemVerilog and Verilog files; a rule runs on the files of
# its language.

name: DO-254
prefix: DO254
version: "1"
title: Best Practice VHDL Coding Standards for DO-254 Programs
source: DO-254 Users Group position paper DO254-UG-001 Rev 1a (2010)

checks:

  # Coding practices

  CP1:
    title: Avoid incorrect VHDL type usage
    severity: Error
    rules: [design_001, sv_lint_001, sv_lint_007]
  CP2:
    title: Avoid duplicate signal assignments
    severity: Warning
    rules: [lint_001]
  CP3:
    title: Avoid hard-coded numeric values
    severity: Warning
    rules: [lint_034]
  CP4:
    title: Avoid hard-coded vector assignment
    severity: Note
    rules: [lint_035]
  CP5:
    title: Ensure consistent FSM state encoding style
    severity: Error
    rules: [lint_027]
  CP6:
    title: Ensure safe FSM transitions
    severity: Error
    rules: [lint_037, design_025]
    note: 'Per file: states never entered, and states never left. Through the logic: branches never taken from reset, proven with SymbiYosys by design_025.'
  CP7:
    title: Avoid mismatching ranges
    severity: Warning
    rules: [design_001, sv_lint_001]
  CP8:
    title: Ensure complete sensitivity list
    severity: Warning
    rules: [lint_002, sv_lint_008]
  CP9:
    title: Ensure proper sub-program body
    severity: Warning
    rules: [lint_036]
  CP10:
    title: Assign value before using
    severity: Warning
    rules: [lint_022, lint_028]
  CP11:
    title: Avoid unconnected input ports
    severity: Error
    rules: [lint_003]
  CP12:
    title: Avoid unconnected output ports
    severity: Note
    rules: [lint_004]
  CP13:
    title: Declare objects before use
    severity: Error
    rules: [design_001, sv_lint_004]
  CP14:
    title: Avoid unused declarations
    severity: Warning
    rules: [sv_lint_005]
    note: Checked in SystemVerilog files; planned for VHDL.

  # Clock domain crossing

  CDC1:
    title: Analyze multiple asynchronous clocks
    rules: [design_008, design_009, design_016, design_017]
    note: The cdc rule set reports more, and mhsg --design --cdc_report writes the crossing report.

  # Safe synthesis

  SS1:
    title: Avoid implied logic
    severity: Warning
    rules: [lint_038]
    note: 'Per file: chains of inverters. GHDL removes such chains before the netlist.'
  SS2:
    title: Ensure proper case statement specification
    severity: Error
    rules: [lint_005, lint_006, lint_007, sv_case_001, sv_lint_006, sv_lint_013]
  SS3:
    title: Avoid combinational feedback
    severity: Error
    rules: [lint_008, design_003]
  SS4:
    title: Avoid latch inference
    severity: Warning
    rules: [lint_009, design_002, sv_lint_002]
  SS5:
    title: Avoid multiple waveforms
    severity: Error
    rules: [lint_029]
  SS6:
    title: Avoid multiple drivers
    severity: Error
    rules: [lint_010, design_004, sv_lint_003, sv_lint_012]
  SS7:
    title: Avoid uninitialized VHDL deferred constants
    severity: Warning
    rules: [lint_032]
  SS8:
    title: Avoid clock used as data
    severity: Error
    rules: [design_010]
  SS9:
    title: Avoid shared clock and reset signal
    severity: Error
    rules: [design_011]
  SS10:
    title: Avoid gated clocks
    severity: Warning
    rules: [design_012]
  SS11:
    title: Avoid internally generated clocks
    severity: Warning
    rules: [design_013]
  SS12:
    title: Avoid internally generated resets
    severity: Warning
    rules: [design_014]
  SS13:
    title: Avoid mixed polarity reset
    severity: Warning
    rules: [lint_011]
  SS14:
    title: Avoid unresettable registers
    severity: Warning
    rules: [lint_012]
  SS15:
    title: Avoid asynchronous reset release
    severity: Error
    rules: [design_015]
  SS16:
    title: Avoid initialization assignments
    severity: Error
    rules: [lint_013]
  SS17:
    title: Avoid undriven and unused logic
    severity: Error
    rules: [design_006, sv_lint_010, sv_lint_005, lint_033]
  SS18:
    title: Ensure register controllability
    severity: Warning
    rules: [design_005]
    note: Registers stuck through the logic that drives them need formal analysis, planned.
  SS19:
    title: Avoid snake paths
    severity: Warning
    rules: [design_007]
  SS20:
    title: Ensure nesting limits
    severity: Warning
    rules: [lint_030]
  SS21:
    title: Ensure consistent vector order
    severity: Warning
    rules: [lint_031]

  # Design reviews

  DR1:
    title: Use statement labels
    severity: Note
    rules: [process_016, process_018, concurrent_013, case_022, case_023, loop_statement_006, loop_statement_007, generate_011, block_007]
    configuration:
      # These remove labels, the opposite of DR1
      concurrent_005: {disable: true}
      case_019: {disable: true}
      case_020: {disable: true}
  DR2:
    title: Avoid mixed case naming for differentiation
    severity: Warning
    rules: [sv_naming_012, constant_013, signal_014, variable_011, function_010, procedure_507, type_014, type_501, subtype_002, alias_declaration_503, entity_600]
    note: VHDL ignores case, so names that differ only in case are one name; the VHDL rules check that each name is written in one case.
  DR3:
    title: Ensure unique name spaces
    severity: Error
    rules: [lint_039]
  DR4:
    title: Use separate declaration style
    severity: Note
    rules: [signal_015, variable_015]
  DR5:
    title: Use separate statement style
    severity: Note
    rules: [sequential_007, if_022, if_024, case_012, loop_statement_001, sv_statement_003]
  DR6:
    title: Ensure consistent indentation
    severity: Note
    groups: [indent]
  DR7:
    title: Avoid using tabs
    severity: Warning
    rules: [whitespace_002]
  DR8:
    title: Avoid large design files
    severity: Warning
    rules: [length_002]
  DR9:
    title: Ensure consistent signal names across hierarchy
    severity: Warning
    rules: [lint_040]
  DR10:
    title: Ensure consistent file header
    severity: Warning
    rules: [lint_041]
  DR11:
    title: Ensure sufficient comment density
    severity: Warning
    rules: [lint_042]
  DR12:
    title: Ensure proper placement of comments
    severity: Note
    status: manual
  DR13:
    title: Ensure company specific naming standards
    severity: Note
    groups: [naming]
    # The prefixes and suffixes are project specific: configure and enable the naming rules first
    enable: false
